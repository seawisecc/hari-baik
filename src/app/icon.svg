<!--
  Lambang Hari Baik.

  Cincin dari empat busur adalah siklus empat fase yang jadi inti aplikasi:
  Mengalir, Tenang, Mawas, Istirahat. Warnanya persis warna yang dipakai di
  kalender, jadi lambangnya sekaligus memperkenalkan kodenya sendiri.

  Celah 28 derajat dan lubang tengah yang lebar dipilih setelah diuji pada
  16px: dengan celah lebih sempit keempat warna menyatu jadi cincin keruh,
  dan dengan cincin lebih tebal lubang tengahnya menutup.

  Tanpa isian gelap di mana pun, supaya sama terbacanya di latar terang
  maupun gelap.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hari Baik">
  <g fill="none" stroke-linecap="round" stroke-width="14">
    <path d="M 37.24 9.53 A 23 23 0 0 1 54.47 26.76" stroke="#7a9e7e" />
    <path d="M 54.47 37.24 A 23 23 0 0 1 37.24 54.47" stroke="#7a8e9e" />
    <path d="M 26.76 54.47 A 23 23 0 0 1 9.53 37.24" stroke="#c4935a" />
    <path d="M 9.53 26.76 A 23 23 0 0 1 26.76 9.53" stroke="#9e5a5a" />
  </g>
</svg>
